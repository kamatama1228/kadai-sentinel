# 通知のルール(授業ごと)
# このファイルを notify.toml にコピーして使う:  cp notify.example.toml notify.toml
# notify.toml は授業IDや時間割を含む個人設定なので Git には入らない。
# 授業IDは `uv run moodle courses` で確認できる。
#
# events(共有チャンネルに流すもの)
#   new           新しい課題・小テストが出た
#   scheduled     公開日時が決まっている小テスト・課題が登録された(「〇時に公開予定」)
#   open          受付・公開が始まった瞬間(授業中の短い小テスト向け)
#   due_changed   締切が変わった
# remind          締切のどれだけ前に知らせるか。"7d" "1d" "3h" "30m" のほか、"@16:30"(締切日のその時刻)
# morning         当日の朝(morning_at)に「今日〇時から小テスト」と予告する
# kinds           対象にする種類。既定は ["小テスト", "課題"]。"アンケート" なども指定できる
# match           名前にこれを含むものだけを対象にする(空なら全部)
# enabled=false   この授業は共有チャンネルに流さない

[default]
enabled = false            # ここに書いていない授業は共有チャンネルに流さない

# 例1: 授業中に短時間だけ公開される小テストがある授業
[course.10001]
name = "例:〇〇概論"
enabled = true
events = ["new", "scheduled", "open", "due_changed"]
morning = true

# 例2: レポートが出る授業。締切の1週間前と前日に知らせる
[course.10002]
name = "例:〇〇演習"
enabled = true
events = ["new", "due_changed"]
remind = ["7d", "1d"]

# 例3: 特定のアンケートだけを流したい授業
[course.10003]
name = "例:ゼミ配属"
enabled = true
kinds = ["アンケート", "課題", "小テスト"]
match = ["希望調査"]
events = ["new", "scheduled", "open", "due_changed"]
remind = ["1d", "3h"]

# Moodle に掲載される前から分かっている締切を手で登録する(掲載されたら自動でそちらに切り替わる)
# [[event]]
# title = "例:配属希望調査"
# course_id = 10003
# course = "例:ゼミ配属"
# open = "2026-11-02 00:00"
# due = "2026-11-06 10:30"
# remind = ["1d", "3h"]
# match = ["希望調査"]

[personal]
# 自分専用チャンネルへの、未提出課題のリマインド
# mirror_shared = true にすると、共有チャンネルの通知も同じものをここに送る(個人チャンネルだけ見ればよくなる)。
#   そのとき共有チャンネルの授業は、二重にならないよう未提出リマインドの対象から自動で外れる
#   mirror_skip_submitted = true(既定)なら、転送する締切リマインドのうち提出済みのものは送らない
mirror_shared = false
mirror_skip_submitted = true
remind = ["1d", "3h"]
exclude = []               # 個人通知もいらない授業のID
changes = true             # 共有チャンネルにない授業の締切が変わったら知らせる
news = "keywords"          # 共有チャンネルにない授業の「お知らせ」:keywords / all / off
# news_keywords = ["休講", "補講", "変更", "オンライン", "延期", "中止", "教室"]   # keywords のときに使う語(既定はこれに近いもの)

# 授業ごとに個人リマインドの時刻を変える例
# [personal.course.10004]
# remind = ["@16:30"]
# days = ["tue"]           # 授業の曜日(出欠の予定がない授業で、オンライン授業の日を決めるのに使う)

# オンライン授業(Zoom などのリンクが置かれた回)を、その日の朝(morning_at)に知らせる(Cloudflare 版)
# 授業の日は Moodle の「出欠」の予定から判断する。出欠の予定がない授業は days = ["thu"] を書く
[online]
enabled = true
shared = true              # 共有チャンネルの授業は共有チャンネルにも流す(false なら個人だけ)
# keywords = ["Zoom", "Teams", "Webex", "遠隔", "オンライン"]   # リンク名にこれを含むとオンライン授業
# exclude = ["VoD", "オンデマンド", "録画"]                    # これを含むものは除く(録画の視聴など)

# 通知を消すルール(コードを触らずに調整する。詳しくは docs/CUSTOMIZE.md)
# 条件 course / title / heading を1つ以上書く。全部に当てはまる通知だけが消える
# [[mute]]
# channel = "personal"     # shared / personal / both
# course = 10004
# heading = "お知らせ"

[watch]
utc_offset = 9             # 時差(日本は 9)。Cloudflare 版で日時を解釈するのに使う
schedule = ["10:00", "22:00"]   # ふだんはこの時刻にだけ確認する
fast = "1m"                # 下の時間帯と、小テスト公開の前後はこの間隔
morning_at = "07:30"       # 朝の予告(今日の小テスト・今日のオンライン授業)を送る時刻
# 1分おきに確認する時間帯(短い小テストがある授業の時間など)。曜日は mon tue wed thu fri sat sun
fast_windows = [
  # { days = ["thu"], start = "13:00", end = "15:00", note = "例:〇〇概論" },
]
