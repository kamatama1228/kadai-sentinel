[project]
name = "kadai-sentinel"
version = "1.0.0"
description = "課題の見張り番: Moodle の課題・締切・小テストを見張って Discord に通知し、手元の AI から読めるようにする"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
moodle = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "cli"]
