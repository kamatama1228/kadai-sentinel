# 本体を直したら、GitHub 上でもテストを自動で動かす(通知の届き方・設定のまとめ方が壊れていないか)
#
# 安全のための決まり(変えるときは docs/MAINTAINING.md も見る)
# - アクションはタグではなくコミットの SHA で固定する(タグを付け替えられる攻撃を防ぐ)。横に版を書き、更新は Dependabot の知らせで行う
# - このワークフローは読むだけ。書き込みの権限を渡さない(permissions)、リポジトリの認証情報を残さない(persist-credentials)
# - npm のインストール時スクリプトは動かさない(--ignore-scripts)。テストに要るのは smol-toml だけで、スクリプトは不要
# - Python は uv.lock の版どおりに入れる(uv sync --frozen)
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: 通知と設定のテスト
        working-directory: worker
        run: |
          npm ci --ignore-scripts
          npm test
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: false
      - name: コマンドが動くか(Moodle には接続しない)
        run: |
          uv sync --frozen
          uv run python -m compileall -q core cli
          uv run moodle --version
